# Fabrica MFX: compila cada extension de mfx/, la empaqueta como
# .mfx (dex + manifest), la FIRMA con la llave privada del
# secret MFX_LLAVE_PRIVADA (ECDSA P-256) y publica:
#   - rama builds: los .mfx compilados (un solo commit vigente)
#   - rama main: index.json con urlMfx/fileHashMfx/firmaMfx
name: build-mfx

on:
  push:
    branches: [main]
    paths: ["mfx/**", "index.json", "settings.gradle.kts", "build.gradle.kts",
            "api/**", "scripts/**", ".github/workflows/build-mfx.yml"]
  workflow_dispatch:

concurrency:
  group: build-mfx
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout extensiones
        uses: actions/checkout@v4
        with:
          path: ext

      - name: Checkout apk MangaFox
        uses: actions/checkout@v4
        with:
          repository: harley654321/MangaFox
          path: MangaFox

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Plataforma y build-tools
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-35/android.jar" >> "$GITHUB_ENV"
          echo "D8=$ANDROID_HOME/build-tools/35.0.0/d8" >> "$GITHUB_ENV"

      - name: Copiar superficie API congelada
        run: |
          SRC=MangaFox/app/src/main/java/com/harley/mangafox
          DST=ext/api/src/main/kotlin/com/harley/mangafox
          mkdir -p "$DST"/{mfx/api,data/parser,data/web,debug,logic/home,logic/detalle,logic/lector,logic/directorio}
          cp "$SRC/mfx/api/FuenteMfx.kt"            "$DST/mfx/api/"
          cp "$SRC/data/parser/TemaFuente.kt"       "$DST/data/parser/"
          cp "$SRC/data/parser/MiniHtml.kt"         "$DST/data/parser/"
          cp "$SRC/data/web/ClienteWeb.kt"          "$DST/data/web/"
          cp "$SRC/debug/MangaFoxLog.kt"            "$DST/debug/"
          cp "$SRC/logic/home/ObraHome.kt"          "$DST/logic/home/"
          cp "$SRC/logic/detalle/ObraDetalle.kt"    "$DST/logic/detalle/"
          cp "$SRC/logic/detalle/Capitulo.kt"       "$DST/logic/detalle/"
          cp "$SRC/logic/lector/PaginasCapitulo.kt" "$DST/logic/lector/"
          cp "$SRC/logic/directorio/Genero.kt"      "$DST/logic/directorio/"

      - name: Compilar api.jar y extension
        working-directory: ext
        run: |
          gradle --no-daemon -PandroidJar="$ANDROID_JAR" :api:jar :mfx-mhscans:jar

      - name: Empaquetar, firmar y parchear index
        working-directory: ext
        env:
          MFX_LLAVE_PRIVADA: ${{ secrets.MFX_LLAVE_PRIVADA }}
        run: |
          set -e
          rm -rf dist dexwork && mkdir -p dist dexwork
          "$D8" --release --min-api 23 --lib "$ANDROID_JAR" \
            --classpath api/build/libs/api.jar \
            mfx/mhscans/build/libs/*.jar --output dexwork
          cp dexwork/classes.dex dist/
          cp mfx/mhscans/manifest.json dist/
          (cd dist && zip -q mhscans.mfx manifest.json classes.dex)
          HASH=$(sha256sum dist/mhscans.mfx | cut -d' ' -f1)
          printf '%s' "$MFX_LLAVE_PRIVADA" > llave.pem
          openssl dgst -sha256 -sign llave.pem -out mhscans.sig dist/mhscans.mfx
          FIRMA=$(base64 -w0 mhscans.sig)
          rm llave.pem mhscans.sig
          V=$(python3 -c "import json;print(json.load(open('mfx/mhscans/manifest.json'))['version'])")
          python3 scripts/actualizar_index_mfx.py mhscans "$V" "$HASH" "$FIRMA"

      - name: Publicar index en main
        working-directory: ext
        run: |
          git config user.name "mfx-ci"
          git config user.email "ci@users.noreply.github.com"
          if git diff --quiet index.json; then
            echo "index sin cambios"
          else
            git add index.json
            git commit -m "build(mfx): mhscans publicado por CI [skip ci]"
            git push
          fi

      - name: Publicar .mfx en rama builds
        run: |
          mkdir -p pub/mfx
          cp ext/dist/mhscans.mfx pub/mfx/
          cd pub
          git init -q
          git checkout -q -b builds
          git add mfx
          git commit -q -m "build mfx $GITHUB_SHA"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/harley654321/mangafox-extensions.git" builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
